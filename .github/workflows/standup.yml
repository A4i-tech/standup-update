name: Daily Standup

on:
  schedule:
    - cron: '30 3 * * 1-5'  # 9:00 AM IST Mon-Fri
  workflow_dispatch:  # allow manual trigger

jobs:
  standup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Send standup to Teams
        env:
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          POWER_AUTOMATE_URL: ${{ secrets.POWER_AUTOMATE_URL }}
          EMAIL_FLOW_URL: ${{ secrets.EMAIL_FLOW_URL }}
          EMAIL_MAP: ${{ secrets.EMAIL_MAP }}
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
        run: python3 standup.py
